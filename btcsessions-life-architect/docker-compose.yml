version: "3.7"

services:

  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: btcsessions-life-architect_web_1
      APP_PORT: 4600

  web:
    image: ghcr.io/btcsessions/life-architect:0.1.0
    restart: on-failure
    user: "1000:1000"
    init: true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      TZ: America/Edmonton
