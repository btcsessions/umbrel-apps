manifestVersion: 1
id: btcsessions-life-architect
name: Life Architect
tagline: One deck for everything on your plate
icon: https://raw.githubusercontent.com/btcsessions/umbrel-apps/main/btcsessions-life-architect/icon.svg
category: automation
version: "0.9.0"
port: 4600
description: >-
  A personal command deck. One ranked "next up" list, voice quick-add, and modules for each area of life:
  trips, a Gmail inbox that drafts replies and hands mail off, a PIN-locked money dashboard,
  and a PIN-locked People section that only its own model ever reads.
developer: BTC Sessions
website: https://github.com/btcsessions/umbrel-apps
submitter: BTC Sessions
submission: https://github.com/btcsessions/umbrel-apps
repo: ""
support: https://github.com/btcsessions/umbrel-apps/issues
gallery: []
releaseNotes: >-
  Inbox now shows only what Hermes's email sort flags as needing you: one badge per run that clears when you
  open it, Hermes's draft replies ready to send, watches that only re-flag when something changes, and a digest
  of what Hermes handled. The app no longer sorts mail or sends it to a model by itself, and mail bodies are
  stripped of hidden text before storing.
